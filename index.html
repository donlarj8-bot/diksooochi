<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diksoochi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --accent: #ff4444;
    --accent2: #ff8800;
    --text: #f0f0f0;
    --muted: #666;
    --card-bg: #111;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ff4444, #ff8800);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span {
    color: var(--muted);
    font-size: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    -webkit-text-fill-color: var(--muted);
    margin-top: -6px;
  }

  .count-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }

  .count-badge strong { color: var(--accent); font-weight: 500; }

  .input-zone {
    padding: 32px 40px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .input-label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    max-width: 800px;
  }

  .url-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 20px;
    font-size: 0.95rem;
    font-family: 'DM Sans', sans-serif;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .url-input:focus { border-color: var(--accent); }
  .url-input::placeholder { color: var(--muted); }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.5px;
  }

  .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .status { margin-top: 10px; font-size: 0.82rem; min-height: 18px; color: var(--muted); transition: color 0.2s; }
  .status.loading { color: #ff8800; }
  .status.error   { color: var(--accent); }
  .status.success { color: #44cc77; }

  .toolbar {
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .filter-tabs { display: flex; gap: 8px; }

  .filter-tab {
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-tab.active, .filter-tab:hover { border-color: var(--accent); color: var(--text); }

  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    outline: none;
    cursor: pointer;
  }

  .grid-section { padding: 32px 40px 60px; }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    animation: fadeIn 0.3s ease both;
    position: relative;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover { border-color: #333; transform: translateY(-3px); }
  .card:hover .card-actions { opacity: 1; }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #0d0d0d;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }

  .card:hover .thumb-wrap img { transform: scale(1.03); }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0);
    transition: background 0.2s;
    cursor: pointer;
  }

  .card:hover .play-overlay { background: rgba(0,0,0,0.35); }

  .play-btn {
    width: 52px;
    height: 52px;
    background: rgba(255,68,68,0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
  }

  .card:hover .play-btn { opacity: 1; transform: scale(1); }
  .play-btn svg { margin-left: 4px; }

  .card-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .action-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: transform 0.15s;
  }

  .action-btn:hover { transform: scale(1.15); }
  .delete-btn { background: rgba(255,68,68,0.9); color: white; }
  .star-btn   { background: rgba(255,136,0,0.9); color: white; }

  .card-body { padding: 14px 16px 16px; }

  .card-title {
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-channel { font-size: 0.75rem; color: var(--muted); font-weight: 300; }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }

  .card-date { font-size: 0.7rem; color: #444; font-weight: 300; }
  .starred-badge { font-size: 0.7rem; color: var(--accent2); }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }

  .empty h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: #333;
    margin-bottom: 8px;
  }

  .empty p { font-size: 0.85rem; font-weight: 300; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }

  @media (max-width: 600px) {
    header { padding: 20px; }
    .input-zone { padding: 20px; }
    .toolbar { padding: 14px 20px; }
    .grid-section { padding: 20px; }
    .input-row { flex-direction: column; }
    .logo { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    Diksoochi
    <span>Your YouTube Trend Vault</span>
  </div>
  <div class="count-badge">
    <strong id="video-count">0</strong> videos saved
  </div>
</header>

<div class="input-zone">
  <div class="input-label">↓ Paste a YouTube link to save it</div>
  <div class="input-row">
    <input class="url-input" id="url-input" type="text" placeholder="https://www.youtube.com/watch?v=..." />
    <button class="add-btn" id="add-btn" onclick="addVideo()">+ Save Video</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="toolbar">
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
    <button class="filter-tab" onclick="setFilter('starred', this)">⭐ Starred</button>
  </div>
  <select class="sort-select" id="sort-select" onchange="renderGrid()">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
  </select>
</div>

<div class="grid-section">
  <div class="video-grid" id="video-grid">
    <div class="empty">
      <div class="empty-icon">📺</div>
      <h3>Loading...</h3>
      <p>Connecting to your vault</p>
    </div>
  </div>
</div>

<script>
  // ── Supabase setup ────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://sjsdnfxzjasmuujespmz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Jk5w5SSEigzAVTTs1edi_A_OLLjEyzn';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allVideos = [];
  let currentFilter = 'all';

  // ── Helpers ───────────────────────────────────────────────────────────

  function extractVideoId(url) {
    const patterns = [
      /(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /^([a-zA-Z0-9_-]{11})$/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function updateCount() {
    document.getElementById('video-count').textContent = allVideos.length;
  }

  // ── Load videos ───────────────────────────────────────────────────────

  async function loadVideos() {
    const { data, error } = await sb.from('videos').select('*').order('saved_at', { ascending: false });
    if (error) { console.error(error); return; }
    allVideos = data || [];
    updateCount();
    renderGrid();
  }

  // ── Fetch video info ──────────────────────────────────────────────────

  async function fetchVideoInfo(url) {
    const apiUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('Could not fetch video info');
    const data = await res.json();
    return { title: data.title, channel: data.author_name };
  }

  // ── Add video ─────────────────────────────────────────────────────────

  async function addVideo() {
    const input = document.getElementById('url-input');
    const btn   = document.getElementById('add-btn');
    const url   = input.value.trim();

    if (!url) { setStatus('Paste a YouTube link first!', 'error'); return; }

    const videoId = extractVideoId(url);
    if (!videoId) { setStatus("That doesn't look like a valid YouTube link.", 'error'); return; }

    if (allVideos.find(v => v.id === videoId)) {
      setStatus('You already saved this one!', 'error');
      return;
    }

    btn.disabled = true;
    setStatus('Fetching video info…', 'loading');

    try {
      const info = await fetchVideoInfo(url);
      const newVideo = {
        id: videoId,
        title: info.title,
        channel: info.channel,
        thumb: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
        url: `https://www.youtube.com/watch?v=${videoId}`,
        saved_at: Date.now(),
        starred: false
      };

      const { error } = await sb.from('videos').insert([newVideo]);
      if (error) throw error;

      allVideos.unshift(newVideo);
      updateCount();
      renderGrid();
      input.value = '';
      setStatus(`✓ Saved: "${info.title}"`, 'success');
    } catch (e) {
      console.error(e);
      setStatus("Couldn't save this video. Double-check the link!", 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ── Delete ────────────────────────────────────────────────────────────

  async function deleteVideo(id) {
    await sb.from('videos').delete().eq('id', id);
    allVideos = allVideos.filter(v => v.id !== id);
    updateCount();
    renderGrid();
  }

  // ── Star ──────────────────────────────────────────────────────────────

  async function toggleStar(id) {
    const video = allVideos.find(v => v.id === id);
    if (!video) return;
    const newStarred = !video.starred;
    await sb.from('videos').update({ starred: newStarred }).eq('id', id);
    video.starred = newStarred;
    renderGrid();
  }

  // ── Filter ────────────────────────────────────────────────────────────

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  // ── Render ────────────────────────────────────────────────────────────

  function renderGrid() {
    const grid = document.getElementById('video-grid');
    const sort = document.getElementById('sort-select').value;
    let videos = [...allVideos];

    if (currentFilter === 'starred') videos = videos.filter(v => v.starred);
    if (sort === 'oldest') videos = videos.reverse();

    grid.innerHTML = '';

    if (videos.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📺</div>
          <h3>${currentFilter === 'starred' ? 'No starred videos yet' : 'Your vault is empty'}</h3>
          <p>${currentFilter === 'starred' ? 'Star videos to find them here' : 'Paste a YouTube link above to get started'}</p>
        </div>`;
      return;
    }

    videos.forEach((v, i) => {
      const date = new Date(v.saved_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'2-digit' });
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 40) + 'ms';
      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${v.thumb}" alt="${v.title}"
               onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'">
          <div class="play-overlay" onclick="window.open('${v.url}','_blank')">
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </div>
          </div>
          <div class="card-actions">
            <button class="action-btn star-btn" title="Star" onclick="toggleStar('${v.id}')">
              ${v.starred ? '★' : '☆'}
            </button>
            <button class="action-btn delete-btn" title="Delete" onclick="deleteVideo('${v.id}')">✕</button>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">${v.title}</div>
          <div class="card-channel">${v.channel}</div>
          <div class="card-meta">
            <div class="card-date">Saved ${date}</div>
            ${v.starred ? '<div class="starred-badge">★ Starred</div>' : ''}
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  // ── Enter key ─────────────────────────────────────────────────────────

  document.getElementById('url-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addVideo();
  });

  // ── Init ──────────────────────────────────────────────────────────────
  loadVideos();
</script>
</body>
</html>
